<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffc8d2">
<title>Blobi Love Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#ffc8d2;--deep:#e594a4;--ink:#4a2c36;--sky:#fff3f6;--blob:#f2b3ad;--blob2:#d9857f;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(circle at 20% 10%,#ffe0e6 0,transparent 45%),radial-gradient(circle at 85% 90%,#f5a9b9 0,transparent 50%),var(--blue);
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
main{width:100%;max-width:720px;background:var(--white);border-radius:22px;padding:28px 24px 26px;box-shadow:0 18px 40px rgba(20,50,90,.28)}
h1{margin:0 0 4px;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;text-align:center}
.sub{margin:0 0 22px;text-align:center;opacity:.75}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-weight:500;margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid #f5c2cc;border-radius:12px;color:var(--ink);background:var(--sky)}
input:focus{outline:3px solid #ffd35c;outline-offset:1px;border-color:var(--blue)}
button{margin-top:16px;width:100%;font:inherit;font-weight:600;font-size:1.2rem;padding:14px;border:0;border-radius:14px;background:var(--blue);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--deep);transition:transform .08s,box-shadow .08s}
button:hover{background:#ffb8c6}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
button:focus-visible{outline:3px solid #ffd35c;outline-offset:3px}
#result{margin-top:26px;text-align:center}
#result[hidden]{display:none}
#err{color:#b3261e;margin:12px 0 0;text-align:center;min-height:1.2em}
@media (prefers-reduced-motion:reduce){button{transition:none}}
@media (max-width:460px){.pair{grid-template-columns:1fr}}
#cv{display:block;width:100%;height:auto;aspect-ratio:640/330}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>Blobi Love Tester</h1>
  <p class="sub">Wie gut passen zwei Namen zusammen?</p>
  <form id="f" autocomplete="off" novalidate>
    <div class="pair">
      <div><label for="a">Erster Name</label><input id="a" maxlength="40"></div>
      <div><label for="b">Zweiter Name</label><input id="b" maxlength="40"></div>
    </div>
    <button type="submit">Testen</button>
  </form>
  <p id="err" role="alert"></p>
  <section id="result" hidden>
    <canvas id="cv" width="640" height="330" role="img" aria-label="Ergebnis"></canvas>
    <p id="live" class="sr" role="status"></p>
  </section>
</main>

<script>
(()=>{'use strict';
//CORE
const RULES=[[/tsch|sch|sh/g,'s'],[/ph/g,'f'],[/ch/g,'x'],[/th|dt/g,'t'],[/ck|c|q/g,'k'],[/w/g,'v'],[/z/g,'s'],[/y|j/g,'i'],[/h/g,''],[/ie/g,'i'],[/(.)\1+/g,'$1'],[/^i(?=[aeou])/,'']];
function norm(s){
  s=s.normalize('NFC').toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'e').replace(/ö/g,'o').replace(/ü/g,'u')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
  for(const[r,t]of RULES)s=s.replace(r,t);
  return s;
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const K=16;
function vec(n){
  const v=new Array(K).fill(0),p='^'+n+'$',L=p.length;
  const add=(g,w)=>{const r=rng(hash(g));for(let i=0;i<K;i++)v[i]+=w*(r()*2-1)};
  for(const c of n)add('1'+c,.3);
  for(let i=0;i<L-1;i++)add('2'+p.slice(i,i+2),L-i<=5?4:.7);
  for(let i=0;i<L-2;i++)add('3'+p.slice(i,i+3),L-i<=6?6:1);
  const m=Math.hypot(...v)||1;return v.map(x=>x/m);
}
const M=(()=>{const r=rng(7771979),m=[];for(let i=0;i<K;i++)m.push([]);
  for(let i=0;i<K;i++)for(let j=i;j<K;j++){const x=r()*2-1;m[i][j]=x;m[j][i]=x}return m})();
function erf(x){const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
const S=(...a)=>new Set(a.map(norm));
const ROSA=['Rosina','Rosine','Rosä','Rosae'];
const EXC=[
  [S('Dan','Dann'),S(...ROSA),99],
  [S('Ivan','Iwan','Vanya','Vanja'),S(...ROSA),100],
  [S('Valentin','Wäli','Wali','Weli'),S('Michelle','Michele','Mischelle','Mishelle'),98]
];
function score(a,b){
  const na=norm(a),nb=norm(b);
  for(const[A,B,p]of EXC)if((A.has(na)&&B.has(nb))||(A.has(nb)&&B.has(na)))return p;
  const va=vec(na),vb=vec(nb);let x=0;
  for(let i=0;i<K;i++)for(let j=0;j<K;j++)x+=va[i]*M[i][j]*vb[j];
  const u=.5*(1+erf(x/.577/Math.SQRT2));
  return Math.round(4+93*u);
}
//ENDCORE

const blob=new Image();
const blobReady=new Promise(r=>{blob.onload=r;blob.onerror=r});
blob.src=BLOB_SRC;
const HEART=new Path2D('M50 86C20 62 4 46 4 28 4 14 15 5 28 5c9 0 17 5 22 13C55 10 63 5 72 5c13 0 24 9 24 23 0 18-16 34-46 58z');
const cv=$('cv'),ctx=cv.getContext('2d');
const W=640,H=330,dpr=Math.min(window.devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr;
const FONT="Fredoka,'Trebuchet MS',system-ui,sans-serif";

function fit(t,maxW,size,weight){
  let s=size;ctx.font=weight+' '+s+'px '+FONT;
  while(ctx.measureText(t).width>maxW&&s>14){s-=1;ctx.font=weight+' '+s+'px '+FONT}
  if(ctx.measureText(t).width>maxW){while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);t+='…'}
  return t;
}
function drawBlob(cx,cy,w,flip){
  if(!blob.naturalWidth)return;
  const h=w*blob.naturalHeight/blob.naturalWidth;
  ctx.save();ctx.translate(cx,cy);if(flip)ctx.scale(-1,1);
  ctx.drawImage(blob,-w/2,-h/2,w,h);ctx.restore();
}
function draw(R,shown,bar,hs){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  // blobs: the fish faces left, so the left one is mirrored and both look at each other
  drawBlob(105,100,190,true);
  drawBlob(535,100,190,false);
  // heart
  ctx.save();ctx.translate(320,100);ctx.scale(hs,hs);
  ctx.scale(1.45,1.45);ctx.translate(-50,-45);
  ctx.fillStyle='#e8607a';ctx.strokeStyle='#c43e5a';ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.fill(HEART);ctx.stroke(HEART);ctx.restore();
  ctx.save();ctx.font='600 38px '+FONT;ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowOffsetY=2;ctx.shadowBlur=0;
  ctx.fillText(shown+'%',320,100*1+4);ctx.restore();
  // names + message
  ctx.fillStyle='#4a2c36';
  ctx.font='600 26px '+FONT;
  if(ctx.measureText(R.names).width<=600){ctx.fillText(R.names,320,218)}
  else{ctx.fillText(fit(R.a+' +',600,22,600),320,206);ctx.fillText(fit(R.b,600,22,600),320,232)}
  ctx.globalAlpha=.85;ctx.fillText(fit(R.msg,600,19,400),320,258);ctx.globalAlpha=1;
  // bar
  const bx=20,bw=600,by=290,bh=16;
  ctx.fillStyle='#fde3e8';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,8);ctx.fill();
  const fw=Math.max(0,bw*bar/100);
  if(fw>0){
    const g=ctx.createLinearGradient(bx,0,bx+bw,0);g.addColorStop(0,'#ffc8d2');g.addColorStop(1,'#e8607a');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(bx,by,Math.max(fw,bh),bh,8);ctx.fill();
  }
}
let raf=0,run=0;
function play(R){
  cancelAnimationFrame(raf);const id=++run;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){draw(R,R.p,R.p,1);return}
  const D=750,B=600,t0=performance.now();
  const beat=t=>t>=1?1:t<.6?.6+.55*(t/.6):1.15-.15*((t-.6)/.4);
  const step=now=>{
    if(id!==run)return;
    const t=now-t0,k=Math.min(1,t/D),e=1-Math.pow(1-k,2);
    draw(R,Math.round(R.p*e),R.p*e,beat(Math.min(1,t/B)));
    if(k<1||t<B)raf=requestAnimationFrame(step);else draw(R,R.p,R.p,1);
  };
  raf=requestAnimationFrame(step);
}
const fontReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('600 26px Fredoka'),document.fonts.load('400 19px Fredoka')]).catch(()=>{}):Promise.resolve();

$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const a=$('a').value.trim(),b=$('b').value.trim();
  if(!norm(a)||!norm(b)){$('err').textContent='Bitte zwei Namen mit Buchstaben eingeben.';$('result').hidden=true;return}
  $('err').textContent='';
  const p=score(a,b),msg=TIERS.find(t=>p<t[0])[1];
  const R={names:a+' + '+b,a,b,msg,p};
  await Promise.all([blobReady,fontReady]);
  cv.setAttribute('aria-label',R.names+': '+p+'%. '+msg);
  $('live').textContent=R.names+': '+p+'%. '+msg;
  $('result').hidden=false;
  play(R);
});
})();
